
name: Build Orto in Stagione Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Extract project
        run: |
          unzip -q Orto_in_Stagione_Android_progetto.zip -d project

      - name: Prepare Android
        run: |
          cd "$(dirname "$(find project -name package.json -print -quit)")"
          npm install
          npm install -D typescript
          npm install -D ts-node
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd "$(dirname "$(find project -name package.json -print -quit)")/android"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orto-in-Stagione-APK
          path: project/**/android/app/build/outputs/apk/debug/*.apk
